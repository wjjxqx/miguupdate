name: IPTV 咪咕直播源更新

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  update-iptv-source:
    name: 更新咪咕直播源
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 访问更新接口
        run: |
          echo "正在请求更新接口..."
          response=$(curl -s -w "\n%{http_code}" "https://iptv.xinsite.qzz.io/admin_handler.php?action=update" --max-time 30)
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n -1)

          echo "HTTP 状态码: $http_code"
          echo "响应内容: $body"

          if [ "$http_code" -eq 200 ]; then
            echo "[SUCCESS] 更新请求成功"
          else
            echo "[FAILED] 更新请求失败，状态码: $http_code"
            exit 1
          fi

      - name: 记录运行时间
        run: |
          echo "更新完成时间: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
